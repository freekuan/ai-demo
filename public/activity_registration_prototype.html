<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>线下活动报名 · SaaS B/C 端双端联动原型 Demo</title>
  <style>
    :root {
      --bg-canvas: #F3F4F6;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F8FAFC;
      --border: #E5E7EB;
      --border-strong: #D1D5DB;
      --text-primary: #111827;
      --text-secondary: #4B5563;
      --text-muted: #9CA3AF;

      --b-primary: #0F766E;
      --b-primary-hover: #115E59;
      --b-primary-soft: #F0FDFA;
      --b-primary-border: #99F6E4;

      --c-accent: #FF521B;
      --c-accent-hover: #E04312;
      --c-accent-soft: #FFF4F0;
      --c-volt: #C8F135;
      --c-dark: #14171F;

      --success: #059669;
      --success-soft: #ECFDF5;
      --warning: #D97706;
      --warning-soft: #FFFBEB;
      --danger: #DC2626;
      --danger-soft: #FEF2F2;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 6px 20px rgba(15, 23, 42, 0.08);
      --shadow-phone: 0 24px 60px rgba(15, 23, 42, 0.18), 0 0 0 1px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .num { font-variant-numeric: tabular-nums; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    input, select, textarea { font-family: inherit; }

    /* Top Workspace Bar */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      height: 58px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, var(--b-primary), #14B8A6);
      color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 15px;
    }
    .brand-title { font-weight: 700; font-size: 15px; }
    .brand-sub {
      font-size: 12px; color: var(--b-primary); background: var(--b-primary-soft);
      border: 1px solid var(--b-primary-border); padding: 2px 8px; border-radius: 999px; font-weight: 600;
    }

    .view-switcher { display: flex; background: #EEF0F4; padding: 3px; border-radius: 10px; gap: 2px; }
    .view-btn { padding: 6px 14px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--text-secondary); transition: all 0.18s; }
    .view-btn.active { background: #fff; color: var(--text-primary); box-shadow: var(--shadow-sm); }

    .sync-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.18); }

    /* Main Workspace */
    .workspace {
      display: grid;
      grid-template-columns: 1fr 416px;
      gap: 22px;
      padding: 20px 24px 36px;
      max-width: 1580px;
      margin: 0 auto;
      align-items: start;
    }
    .workspace.only-b { grid-template-columns: 1fr; max-width: 1280px; }
    .workspace.only-b .c-pane { display: none; }
    .workspace.only-c { grid-template-columns: 1fr; justify-items: center; }
    .workspace.only-c .b-pane { display: none; }
    @media (max-width: 1120px) {
      .workspace { grid-template-columns: 1fr; }
      .c-pane { justify-self: center; }
    }

    /* ==================== B-END SAAS ADMIN ==================== */
    .b-pane {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      min-height: 780px;
      display: flex;
      flex-direction: column;
    }
    .b-header {
      padding: 14px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FCFDFE;
      gap: 10px;
      flex-wrap: wrap;
    }
    .b-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .b-tab {
      padding: 7px 13px; border-radius: 8px; font-size: 13px; font-weight: 600;
      color: var(--text-secondary); display: flex; align-items: center; gap: 6px; transition: all 0.15s;
    }
    .b-tab:hover { background: #F3F4F6; color: var(--text-primary); }
    .b-tab.active { background: var(--b-primary-soft); color: var(--b-primary); }
    .count-pill { font-size: 11px; padding: 1px 6px; border-radius: 999px; background: rgba(15, 118, 110, 0.12); color: var(--b-primary); }
    .b-body { padding: 20px 22px; flex: 1; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; transition: all 0.15s;
    }
    .btn-primary { background: var(--b-primary); color: #fff; }
    .btn-primary:hover { background: var(--b-primary-hover); }
    .btn-outline { background: #fff; color: var(--text-primary); border: 1px solid var(--border-strong); }
    .btn-outline:hover { background: #F9FAFB; }
    .btn-ghost { color: var(--text-secondary); padding: 5px 8px; }
    .btn-ghost:hover { background: #F3F4F6; color: var(--text-primary); }
    .btn-danger-soft { background: var(--danger-soft); color: var(--danger); }
    .btn-danger-soft:hover { background: #FEE2E2; }
    .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* KPI Strip */
    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
    .kpi-card { background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; }
    .kpi-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
    .kpi-val { font-size: 22px; font-weight: 700; color: var(--text-primary); }
    .kpi-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* Filters & Table */
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
    .toolbar-left { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .input, .select {
      height: 34px; padding: 0 10px; border: 1px solid var(--border-strong);
      border-radius: 8px; font-size: 13px; color: var(--text-primary); background: #fff; outline: none;
    }
    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--b-primary); box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }
    .textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--border-strong); border-radius: 8px; font-size: 13px; resize: vertical; outline: none; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; padding: 10px 10px; background: #F8FAFC; color: var(--text-secondary);
      font-weight: 600; font-size: 12px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    td { padding: 11px 10px; border-bottom: 1px solid #F1F5F9; vertical-align: middle; }
    tr:hover td { background: #FAFBFD; }

    .tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .tag-green { background: var(--success-soft); color: var(--success); }
    .tag-orange { background: var(--warning-soft); color: var(--warning); }
    .tag-gray { background: #F3F4F6; color: #6B7280; }
    .tag-red { background: var(--danger-soft); color: var(--danger); }
    .tag-teal { background: var(--b-primary-soft); color: var(--b-primary); }

    .act-cell { display: flex; align-items: center; gap: 10px; }
    .act-thumb {
      width: 46px; height: 36px; border-radius: 6px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 11px;
    }
    .act-name { font-weight: 600; color: var(--text-primary); }
    .act-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* B-End Form Editor */
    .form-section { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; margin-bottom: 14px; background: #fff; }
    .form-section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
    .form-section-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .form-section-tip { font-size: 12px; color: var(--text-muted); }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
    .field label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
    .sub-row {
      display: grid; gap: 8px; align-items: center; padding: 10px;
      background: #F8FAFC; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px;
    }
    .session-row { grid-template-columns: 1.5fr 1fr 0.65fr auto; }
    .ticket-row { grid-template-columns: 1.4fr 0.65fr 1.35fr auto; }
    .custom-field-row { grid-template-columns: 1.1fr 0.85fr 1.1fr 0.65fr auto; }

    .chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .check-chip {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px;
      border-radius: 8px; border: 1px solid var(--border-strong); font-size: 12px; font-weight: 500;
      cursor: pointer; user-select: none; background: #fff;
    }
    .check-chip.checked { border-color: var(--b-primary); background: var(--b-primary-soft); color: var(--b-primary); font-weight: 600; }

    .rule-radio-row {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      padding: 10px 12px; background: #F8FAFC; border: 1px solid var(--border); border-radius: 8px;
    }
    .rule-radio-row label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }

    /* Stats Dashboard Cards */
    .stats-two-col { display: grid; grid-template-columns: 1.15fr 1fr; gap: 14px; margin-top: 14px; }
    .stat-panel { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; background: #fff; }
    .stat-panel-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .bar-track { height: 7px; background: #EEF2F6; border-radius: 999px; overflow: hidden; margin-top: 4px; }
    .bar-fill { height: 100%; background: var(--b-primary); border-radius: 999px; }
    .size-pill-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .size-pill {
      padding: 6px 12px; border-radius: 8px; background: var(--bg-subtle); border: 1px solid var(--border);
      font-size: 12px; display: flex; gap: 6px; align-items: center;
    }

    /* ==================== C-END MINI PROGRAM SIMULATOR ==================== */
    .c-pane { position: sticky; top: 76px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .role-pill-bar { display: flex; background: #E5E7EB; padding: 3px; border-radius: 999px; width: 390px; }
    .role-pill { flex: 1; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--text-secondary); transition: all 0.18s; }
    .role-pill.active { background: var(--c-dark); color: #fff; box-shadow: var(--shadow-sm); }

    .phone-frame {
      width: 390px; height: 760px; background: #F5F6F8; border-radius: 38px;
      border: 8px solid #181B22; box-shadow: var(--shadow-phone); overflow: hidden;
      display: flex; flex-direction: column; position: relative;
    }
    .mp-nav {
      height: 52px; background: #fff; display: flex; align-items: center; justify-content: space-between;
      padding: 8px 14px 0; border-bottom: 1px solid #F0F1F3; flex-shrink: 0;
    }
    .mp-nav-left { width: 72px; display: flex; align-items: center; }
    .mp-back { font-size: 18px; color: var(--text-primary); width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; }
    .mp-back:hover { background: #F3F4F6; }
    .mp-title { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
    .mp-capsule {
      width: 72px; height: 28px; border: 1px solid #E5E7EB; border-radius: 999px;
      display: flex; align-items: center; justify-content: space-around; padding: 0 6px; font-size: 12px;
    }
    .mp-capsule-div { width: 1px; height: 14px; background: #E5E7EB; }

    .mp-content { flex: 1; overflow-y: auto; position: relative; padding-bottom: 74px; }
    .mp-content::-webkit-scrollbar { width: 4px; }
    .mp-content::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 4px; }

    /* C-end List & Detail */
    .c-cat-tabs { display: flex; gap: 16px; padding: 10px 14px 0; background: #fff; overflow-x: auto; border-bottom: 1px solid #F1F2F4; }
    .c-cat-tab { padding-bottom: 9px; font-size: 13px; font-weight: 600; color: var(--text-secondary); white-space: nowrap; position: relative; }
    .c-cat-tab.active { color: var(--c-dark); }
    .c-cat-tab.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 3px; background: var(--c-accent); }

    .c-filter-bar { display: flex; justify-content: space-around; padding: 9px 12px; background: #fff; font-size: 12px; border-bottom: 1px solid #F1F2F4; }
    .c-filter-chip { padding: 3px 10px; border-radius: 999px; font-size: 12px; color: var(--text-secondary); }
    .c-filter-chip.active { background: var(--c-accent-soft); color: var(--c-accent); font-weight: 600; }

    .c-card-list { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    .c-act-card { background: #fff; border-radius: 14px; padding: 12px; box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04); cursor: pointer; transition: transform 0.15s; }
    .c-act-card:active { transform: scale(0.985); }
    .c-act-top { display: flex; gap: 11px; }
    .c-poster-sm {
      width: 104px; height: 82px; border-radius: 10px; position: relative; overflow: hidden;
      flex-shrink: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; color: #fff;
    }
    .c-status-badge { position: absolute; top: 6px; left: 6px; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: var(--c-accent); color: #fff; }
    .c-status-badge.ended { background: rgba(17, 24, 39, 0.72); }
    .c-act-info { flex: 1; min-width: 0; }
    .c-act-title { font-size: 14px; font-weight: 700; line-height: 1.3; margin-bottom: 4px; }
    .c-act-tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px; background: #F3F4F6; color: var(--text-secondary); margin-bottom: 5px; }
    .c-act-meta { font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .c-act-bottom { margin-top: 10px; padding-top: 9px; border-top: 1px dashed #ECEEF2; display: flex; align-items: center; justify-content: space-between; }

    .avatar-stack { display: flex; align-items: center; }
    .avatar-dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; margin-left: -6px; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; }
    .avatar-dot:first-child { margin-left: 0; }
    .avatar-text { font-size: 11px; color: var(--text-secondary); margin-left: 6px; }

    .c-price { font-size: 15px; font-weight: 800; color: var(--c-accent); }
    .c-cta-sm { padding: 5px 12px; border-radius: 999px; background: var(--c-dark); color: #fff; font-size: 12px; font-weight: 600; }
    .c-cta-sm.disabled { background: #D1D5DB; }

    .c-hero { height: 185px; padding: 18px 16px; color: #fff; display: flex; flex-direction: column; justify-content: space-between; }
    .c-hero-eyebrow { display: inline-flex; align-self: flex-start; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,0.2); backdrop-filter: blur(6px); font-size: 11px; font-weight: 600; }
    .c-hero-headline { font-size: 21px; font-weight: 800; line-height: 1.25; }
    .c-hero-sub { font-size: 12px; opacity: 0.9; margin-top: 4px; }

    .c-section-card { background: #fff; margin: 10px 12px; border-radius: 14px; padding: 14px; box-shadow: 0 1px 4px rgba(15, 23, 42, 0.04); }
    .c-info-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--text-secondary); margin-top: 8px; }
    .c-nav-icon-btn { padding: 4px 9px; border-radius: 999px; background: #EFF6FF; color: #2563EB; font-size: 11px; font-weight: 600; flex-shrink: 0; }
    .progress-track { height: 6px; background: #F1F5F9; border-radius: 999px; overflow: hidden; margin-top: 8px; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--c-accent), #FF8A3D); border-radius: 999px; }

    /* Compact Summary Card (for Single Session / Single SKU) */
    .c-compact-summary {
      background: linear-gradient(180deg, #FFFFFF 0%, #FAFAFC 100%);
      border: 1px solid #E5E7EB;
      border-left: 4px solid var(--c-accent);
      margin: 10px 12px;
      border-radius: 12px;
      padding: 12px 14px;
    }
    .c-adaptive-hint {
      display: inline-block;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 999px;
      background: #EFF6FF;
      color: #1D4ED8;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .c-option-card {
      border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-top: 8px;
      cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: all 0.15s;
    }
    .c-option-card.selected { border-color: var(--c-accent); background: var(--c-accent-soft); }
    .c-option-card.soldout { opacity: 0.5; pointer-events: none; background: #F9FAFB; }
    .stepper { display: inline-flex; align-items: center; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; }
    .stepper button { width: 28px; height: 28px; background: #F9FAFB; font-size: 15px; font-weight: 700; }
    .stepper span { width: 34px; text-align: center; font-weight: 700; font-size: 13px; }
    .attendee-box { background: #F8FAFC; border: 1px solid #E5E7EB; border-radius: 10px; padding: 10px; margin-top: 10px; }
    .attendee-box-title { font-size: 12px; font-weight: 700; color: var(--c-dark); margin-bottom: 8px; }
    .c-field-row { display: grid; grid-template-columns: 78px 1fr; align-items: center; gap: 6px; margin-bottom: 7px; font-size: 12px; }
    .c-input { height: 30px; padding: 0 8px; border: 1px solid #D1D5DB; border-radius: 6px; font-size: 12px; background: #fff; width: 100%; }

    .mp-bottom-bar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: #fff;
      border-top: 1px solid #ECEEF2; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; z-index: 20;
    }
    .mp-tabbar { justify-content: space-around; }
    .mp-tab-item { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--text-muted); font-weight: 600; }
    .mp-tab-item.active { color: var(--c-accent); }
    .mp-tab-icon { font-size: 18px; line-height: 1; }
    .c-primary-btn {
      flex: 1; height: 40px; border-radius: 999px; background: var(--c-accent); color: #fff;
      font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    }
    .c-primary-btn:hover { background: var(--c-accent-hover); }
    .c-primary-btn:disabled { background: #D1D5DB; cursor: not-allowed; }

    .qr-box { margin-top: 10px; padding: 12px; background: #F8FAFC; border: 1px dashed #CBD5E1; border-radius: 10px; text-align: center; }
    .fake-qr {
      width: 106px; height: 106px; margin: 0 auto 6px;
      background: repeating-linear-gradient(90deg, #111 0 6px, #fff 6px 12px), repeating-linear-gradient(0deg, #111 0 6px, transparent 6px 12px);
      background-blend-mode: multiply; border: 6px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-radius: 6px;
    }
    .verify-code-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; font-weight: 800; letter-spacing: 2px; color: var(--c-dark); }

    .scanner-hero { background: var(--c-dark); color: #fff; padding: 18px 16px; text-align: center; }
    .scanner-frame {
      width: 156px; height: 156px; margin: 12px auto; border: 2px solid rgba(200, 241, 53, 0.85);
      border-radius: 16px; position: relative; display: grid; place-items: center;
      background: radial-gradient(circle, rgba(200,241,53,0.12), transparent 70%);
    }
    .scanner-line { position: absolute; left: 10px; right: 10px; height: 2px; background: var(--c-volt); box-shadow: 0 0 10px var(--c-volt); animation: scanMove 2.2s ease-in-out infinite; }
    @keyframes scanMove { 0%, 100% { top: 18px; } 50% { top: 136px; } }
    .verify-success-card { margin: 12px; padding: 16px; border-radius: 14px; background: #ECFDF5; border: 2px solid #10B981; }

    // ==================== HELPERS ====================
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
    }

    function setLayout(mode, btn) {
      const ws = document.getElementById('workspace');
      ws.className = 'workspace' + (mode === 'b' ? ' only-b' : mode === 'c' ? ' only-c' : '');
      document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function getActivity(id) { return state.activities.find(a => a.id === id); }
    function getSession(act, sid) { return act?.sessions.find(s => s.id === sid); }
    function getTicket(act, tid) { return act?.tickets.find(t => t.id === tid); }

    function getActiveFormSchema(act) {
      const preset = act.formFields.map(k => PRESET_FIELDS.find(f => f.key === k)).filter(Boolean);
      const custom = (act.customFields || []).map(cf => ({
        key: cf.id,
        label: cf.label || '未命名字段',
        type: cf.type, // text | number | date | select
        required: !!cf.required,
        options: cf.type === 'select' ? String(cf.options || '').split(/[,，]/).map(s => s.trim()).filter(Boolean) : [],
        placeholder: cf.type === 'number' ? '请输入数字' : '请输入' + (cf.label || '')
      }));
      return [...preset, ...custom];
    }

    function formatCancelRule(act) {
      if (!act.cancelPolicy || act.cancelPolicy.type === 'none') {
        return '报名成功后不支持取消及退款';
      }
      return `场次开始前 ${act.cancelPolicy.hours} 小时可自助免费取消并原路退款，逾期不可退`;
    }

    function canOrderCancel(order, act) {
      if (order.status !== 'pending_verify') return { ok: false, reason: '' };
      if (!act?.cancelPolicy || act.cancelPolicy.type === 'none') {
        return { ok: false, reason: '按活动规则不可取消' };
      }
      return { ok: true, reason: `开始前${act.cancelPolicy.hours}小时可免费退` };
    }

    function getActStats(act) {
      const totalQuota = act.sessions.reduce((s, x) => s + Number(x.quota || 0), 0);
      const totalBooked = act.sessions.reduce((s, x) => s + Number(x.booked || 0), 0);
      const prices = act.tickets.map(t => Number(t.price || 0));
      const minPrice = prices.length ? Math.min(...prices) : 0;
      const maxPrice = prices.length ? Math.max(...prices) : 0;
      return { totalQuota, totalBooked, minPrice, maxPrice };
    }

    function formatPriceRange(act) {
      const { minPrice, maxPrice } = getActStats(act);
      if (maxPrice === 0) return '0元免费';
      if (minPrice === maxPrice) return `¥${minPrice.toFixed(2)}`;
      return `¥${minPrice.toFixed(2)} - ${maxPrice.toFixed(2)}`;
    }

    function formatMinPrice(act) {
      const { minPrice, maxPrice } = getActStats(act);
      if (maxPrice === 0) return '0元报名';
      return minPrice === maxPrice ? `¥${minPrice.toFixed(2)}` : `¥${minPrice.toFixed(2)}起`;
    }

    function allAttendeesFlat() {
      const list = [];
      state.orders.forEach(o => {
        const act = getActivity(o.activityId);
        const ses = getSession(act, o.sessionId);
        const tic = getTicket(act, o.ticketId);
        o.attendees.forEach(att => list.push({ order: o, act, ses, tic, att }));
      });
      return list;
    }

    // ==================== B-END RENDERING ====================
    function renderBEnd() {
      const flat = allAttendeesFlat();
      const pendingCount = flat.filter(x => x.att.status === 'pending_verify').length;

      const tabs = [
        { id: 'activities', label: '活动列表', count: state.activities.length },
        { id: 'attendees', label: '参与人名单 & 导出', count: flat.length },
        { id: 'verifiers', label: '核销员授权', count: state.verifiers.length }
      ];
      if (state.bTab === 'editor') {
        tabs.splice(1, 0, { id: 'editor', label: state.editingActivityId ? '编辑活动' : '发布新活动' });
      }
      if (state.bTab === 'stats') {
        tabs.splice(1, 0, { id: 'stats', label: '活动数据看板' });
      }

      document.getElementById('bTabs').innerHTML = tabs.map(t => `
        <button class="b-tab ${state.bTab === t.id ? 'active' : ''}" onclick="switchBTab('${t.id}')">
          <span>${t.label}</span>
          ${t.count !== undefined ? `<span class="count-pill num">${t.count}</span>` : ''}
        </button>
      `).join('');

      const body = document.getElementById('bBody');
      if (state.bTab === 'activities') renderBActivities(body, pendingCount);
      else if (state.bTab === 'editor') renderBEditor(body);
      else if (state.bTab === 'stats') renderBStats(body);
      else if (state.bTab === 'attendees') renderBAttendees(body, flat);
      else if (state.bTab === 'verifiers') renderBVerifiers(body);
    }

    function switchBTab(tab) { state.bTab = tab; renderBEnd(); }

    function openActStats(actId) {
      state.statsActivityId = actId;
      state.bTab = 'stats';

            <div class="kpi-sub">小程序扫码 · 零企微门槛</div>
          </div>
        </div>

        <div class="toolbar">
          <div class="toolbar-left">
            ${cats.map(c => `

            `).join('')}
          </div>

        <table>
          <thead>

          </thead>
          <tbody>
            ${filtered.map(act => {
              const st = getActStats(act);
              const cancelBadge = act.cancelPolicy?.type === 'none'
                ? '<span class="tag tag-gray">不可取消</span>'
                : `<span class="tag tag-teal">前${act.cancelPolicy.hours}h可退</span>`;
              return `
                <tr>
                  <td>
                    <div class="act-cell">

                    `).join('')}
                  </td>
                  <td>
                    <div class="num" style="font-weight:700">${formatPriceRange(act)} <span style="font-size:11px;font-weight:400;color:var(--text-muted)">(${act.tickets.length} SKU)</span></div>

                  <td class="num">

                  </td>
                  <td>
                    ${act.status === 'active' ? '<span class="tag tag-green">报名中</span>' : '<span class="tag tag-gray">已结束</span>'}

                  <td style="white-space:nowrap">

              `;
            }).join('')}

      `;
    }

    // ==================== B-END ACTIVITY STATS DASHBOARD ====================
    function renderBStats(container) {
      const act = getActivity(state.statsActivityId) || state.activities[0];
      const st = getActStats(act);
      const actOrders = state.orders.filter(o => o.activityId === act.id);
      const actAtts = allAttendeesFlat().filter(x => x.act?.id === act.id);

      const validAtts = actAtts.filter(x => x.att.status !== 'cancelled');
      const verifiedAtts = actAtts.filter(x => x.att.status === 'completed');
      const cancelledAtts = actAtts.filter(x => x.att.status === 'cancelled');
      const netRevenue = actOrders.filter(o => o.status !== 'cancelled').reduce((s, o) => s + o.totalPrice, 0);
      const verifyRate = validAtts.length ? Math.round((verifiedAtts.length / validAtts.length) * 100) : 0;

      // Aggregate T-shirt sizes or select fields from valid attendees
      const sizeCounts = {};
      validAtts.forEach(x => {
        if (x.att.data.size) {

    function exportAttendeesCSV() {
      const flat = allAttendeesFlat();
      const headers = ['报名单号', '主交易单号', '活动名称', '场次', '套餐', '姓名', '手机号', '全部表单明细', '核销码', '状态'];
      const rows = flat.map(({ order, act, ses, tic, att }) => {
        const schema = act ? getActiveFormSchema(act) : [];
        const detail = Object.entries(att.data)
          .filter(([k, v]) => k !== 'name' && k !== 'phone' && v)
          .map(([k, v]) => `${(schema.find(x => x.key === k)?.label || k)}:${v}`).join(' | ');
        return [
          order.id, order.tradeOrderNo || '0元免交易', act?.title || '', ses?.label || '', tic?.name || '',
          att.data.name || '', att.data.phone || '', detail, att.code,
          att.status === 'completed' ? '已核销' : att.status === 'cancelled' ? '已取消' : '待核销'
        ];
      });
      const csv = '\uFEFF' + [headers, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `活动报名参与人名单_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('已导出参与人 CSV 名单（含自定义字段）');
    }

    function startCheckout(actId) {

        attendees: [makeDefaultAttendee(act, 0)]

      goCPage('checkout', actId);

    function makeDefaultAttendee(act, idx) {
      const schema = getActiveFormSchema(act);
      const defaults = idx === 0
        ? { name: '陈思远', phone: '13800138000', gender: '男', size: 'L', idCard: '440305199405121234', petInfo: '边牧 / 已接种', skinType: '混合肌' }
        : { name: '', phone: '', gender: '女', size: 'M', idCard: '', petInfo: '', skinType: '干性肌肤' };
      const obj = {};
      schema.forEach(f => {
        if (defaults[f.key] !== undefined) obj[f.key] = defaults[f.key];
        else if (f.type === 'select' && f.options.length) obj[f.key] = f.options[0];

      return obj;

      while (state.checkout.attendees.length < next) {
        state.checkout.attendees.push(makeDefaultAttendee(act, state.checkout.attendees.length));
      }
      state.checkout.attendees.length = next;
      renderCEnd();
    }

                if (f.type === 'select') {

      const act = getActivity(state.selectedActivityId);
      const ses = getSession(act, state.checkout.sessionId);
      const tic = getTicket(act, state.checkout.ticketId);
      const schema = getActiveFormSchema(act);

      if (!state.checkout.agreed) { showToast('请先勾选同意免责协议'); return; }
      for (let i = 0; i < state.checkout.attendees.length; i++) {
        for (const f of schema) {
          if (f.required && !String(state.checkout.attendees[i][f.key] || '').trim()) {
            showToast(`请完善参与人 ${i + 1} 的「${f.label}」`);
            return;
          }
        }
      }
      if (ses.booked + state.checkout.qty > ses.quota) { showToast('该场次剩余名额不足'); return; }
      if (tic.stockMode === 'limited' && tic.sold + state.checkout.qty > tic.limit) { showToast('该套餐剩余限量不足'); return; }

      const total = tic.price * state.checkout.qty;
      if (total > 0) { state.cModal = 'pay'; renderCEnd(); }
      else finalizeRegistration();
    }

    function finalizeRegistration() {
      const act = getActivity(state.selectedActivityId);
      const ses = getSession(act, state.checkout.sessionId);
      const tic = getTicket(act, state.checkout.ticketId);

      ses.booked += state.checkout.qty;
      tic.sold += state.checkout.qty;

      const total = tic.price * state.checkout.qty;
      const newOrder = {
        id: 'REG-' + Date.now().toString().slice(-6),
        tradeOrderNo: total > 0 ? 'TRD-' + Math.floor(100000000 + Math.random() * 899999999) : null,
        activityId: act.id,
        sessionId: ses.id,
        ticketId: tic.id,
        qty: state.checkout.qty,
        totalPrice: total,
        status: 'pending_verify',
        createdAt: '刚刚',
        attendees: state.checkout.attendees.map((data, idx) => ({
          id: 'ATT-' + Date.now() + idx,
          code: String(Math.floor(100000 + Math.random() * 900000)),
          status: 'pending_verify',
          data: { ...data }
        }))
      };

      state.orders.unshift(newOrder);
      state.cModal = null;
      state.cPage = 'orders';
      state.cOrderTab = 'all';
      showToast(total > 0 ? '报名成功！已同步写入主订单表与活动名单' : '0元报名成功！已同步活动名单');
      renderAll();
    }

    function renderCModal(container) {
      const act = getActivity(state.selectedActivityId);
      if (state.cModal === 'agreement') {
        container.innerHTML = `
          <div class="mp-modal-mask" onclick="state.cModal=null;renderCEnd()">
            <div class="mp-modal-sheet" onclick="event.stopPropagation()">
              <div style="font-size:15px;font-weight:700;margin-bottom:10px">《${act.agreementTitle}》</div>
              <pre style="white-space:pre-wrap;font-family:inherit;font-size:12px;color:var(--text-secondary);line-height:1.7">${act.agreementBody}</pre>
              <button class="c-primary-btn" style="width:100%;margin-top:16px" onclick="state.checkout.agreed=true;state.cModal=null;renderCEnd()">我已阅读并同意</button>
            </div>
          </div>
        `;
      } else if (state.cModal === 'pay') {
        const tic = getTicket(act, state.checkout.ticketId);
        const total = tic.price * state.checkout.qty;
        container.innerHTML = `
          <div class="mp-modal-mask" onclick="state.cModal=null;renderCEnd()">
            <div class="mp-modal-sheet" onclick="event.stopPropagation()">
              <div style="text-align:center">
                <div style="font-size:13px;color:var(--text-secondary)">复用小程序微信收银台</div>
                <div class="num" style="font-size:28px;font-weight:800;margin:8px 0">¥${total.toFixed(2)}</div>
                <div style="font-size:11px;color:var(--b-primary);background:var(--b-primary-soft);padding:4px 10px;border-radius:999px;display:inline-block;margin-bottom:14px">
                  支付后同步写入现有主订单表（order_type = 活动报名）
                </div>
              </div>
              <button class="c-primary-btn" style="width:100%;background:#07C160" onclick="finalizeRegistration()">模拟微信支付成功</button>
            </div>
          </div>
        `;
      }
    }

    function renderCOrders(content, bottom) {
      const tabs = [
        { id: 'all', label: '全部' },
        { id: 'pending_verify', label: '待参与' },
        { id: 'completed', label: '已完成' },
        { id: 'cancelled', label: '已取消' }
      ];
      const list = state.cOrderTab === 'all' ? state.orders : state.orders.filter(o => o.status === state.cOrderTab);

      content.innerHTML = `
        <div class="c-cat-tabs" style="justify-content:space-around">
          ${tabs.map(t => `<button class="c-cat-tab ${state.cOrderTab===t.id?'active':''}" onclick="state.cOrderTab='${t.id}';renderCEnd()">${t.label}</button>`).join('')}
        </div>

        <div class="c-card-list">
          ${list.length === 0 ? `<div style="text-align:center;padding:60px 20px;color:var(--text-muted);font-size:13px">暂无相关报名单</div>` : ''}
          ${list.map(o => {
            const act = getActivity(o.activityId);
            const ses = getSession(act, o.sessionId);
            const tic = getTicket(act, o.ticketId);
            const cancelCheck = canOrderCancel(o, act);
            return `
              <div class="c-act-card" style="cursor:default">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                  <span style="font-size:11px;color:var(--text-muted)" class="num">${o.id}</span>
                  ${o.status === 'pending_verify' ? '<span class="tag tag-orange">待参与 · 待核销</span>' :
                    o.status === 'completed' ? '<span class="tag tag-green">已完成</span>' :
                    '<span class="tag tag-gray">已取消</span>'}
                </div>
                <div style="font-size:14px;font-weight:700">${act?.title || '-'}</div>
                <div style="font-size:12px;color:var(--text-secondary);margin-top:3px">🕒 ${ses?.label || '-'}</div>
                <div style="font-size:12px;color:var(--text-secondary);margin-top:2px">🎁 ${tic?.name || '-'} × ${o.qty}</div>

                ${o.status === 'pending_verify' ? o.attendees.map((att, idx) => `
                  <div class="qr-box">
                    <div style="font-size:11px;color:var(--text-secondary);margin-bottom:6px">
                      参与人 ${idx+1}：<strong>${att.data.name}</strong>
                      ${att.data.size ? `（${att.data.gender || ''} ${att.data.size}码）` : ''}
                    </div>
                    <div class="fake-qr"></div>
                    <div class="verify-code-text">${att.code}</div>
                  </div>
                `).join('') : ''}

                <div class="c-act-bottom">
                  <span class="num" style="font-size:13px;font-weight:700">实付：${o.totalPrice===0?'0元':'¥'+o.totalPrice.toFixed(2)}</span>
                  <div>
                    ${o.status === 'pending_verify'
                      ? (cancelCheck.ok
                          ? `<button class="btn btn-outline btn-sm" onclick="cancelOrder('${o.id}')">自助取消退款</button>`
                          : `<span style="font-size:11px;color:var(--text-muted)">${cancelCheck.reason}</span>`)
                      : ''}
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
      bottom.innerHTML = renderCTabBar('orders');
    }

    function cancelOrder(orderId, fromBEnd = false) {
      const o = state.orders.find(x => x.id === orderId);
      if (!o || o.status !== 'pending_verify') return;
      const act = getActivity(o.activityId);
      if (!fromBEnd && !canOrderCancel(o, act).ok) {
        showToast('该活动不支持自助取消');
        return;
      }
      const ses = getSession(act, o.sessionId);
      const tic = getTicket(act, o.ticketId);

      o.status = 'cancelled';
      o.attendees.forEach(a => a.status = 'cancelled');
      if (ses) ses.booked = Math.max(0, ses.booked - o.qty);
      if (tic) tic.sold = Math.max(0, tic.sold - o.qty);

      showToast('已取消报名并原路退款，场次名额与统计数据已实时更新！');
      renderAll();
    }

    // ==================== C-END VERIFIER ====================
    function renderCVerifier(content, bottom) {
      const pendingList = allAttendeesFlat().filter(x => x.att.status === 'pending_verify');

      content.innerHTML = `
        <div class="scanner-hero">
          <div style="font-size:12px;opacity:0.8">当前核销员：王志愿（临时授权）</div>
          <div class="scanner-frame">
            <div class="scanner-line"></div>
            <span style="font-size:12px;color:var(--c-volt);font-weight:700">对准用户核销码扫描</span>
          </div>
          <div style="display:flex;gap:8px;margin-top:10px">
            <input class="c-input" style="flex:1;height:34px" placeholder="或输入6位核销码"
              value="${state.verifierInputCode}" oninput="state.verifierInputCode=this.value" />
            <button class="btn btn-primary btn-sm" style="background:var(--c-volt);color:#111"
              onclick="verifyByCode(state.verifierInputCode)">核销</button>
          </div>
        </div>

        ${state.lastVerifiedResult ? `
          <div class="verify-success-card">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <span style="color:var(--success);font-weight:800;font-size:15px">✓ 核销签到成功</span>
              <span style="font-size:11px;color:var(--text-muted)">刚刚</span>
            </div>
            <div style="font-size:13px;font-weight:700;margin-top:6px">
              ${state.lastVerifiedResult.att.data.name}（${state.lastVerifiedResult.att.data.phone}）
            </div>
            <div style="font-size:11px;color:var(--text-secondary)">${state.lastVerifiedResult.act.title} · ${state.lastVerifiedResult.ses.label}</div>

            <div class="verify-highlight-kit">
              <div style="font-size:11px;opacity:0.85;color:#fff">请直接发放以下套餐 / 物资</div>
              <div style="font-size:16px;font-weight:800;margin-top:4px">${state.lastVerifiedResult.tic.name}</div>
              <div style="font-size:18px;font-weight:800;margin-top:4px;color:#fff">
                ${[state.lastVerifiedResult.att.data.gender, state.lastVerifiedResult.att.data.size ? state.lastVerifiedResult.att.data.size + '码' : '', state.lastVerifiedResult.att.data.petInfo, state.lastVerifiedResult.att.data.skinType].filter(Boolean).join(' · ') || '标准签到入场'}
              </div>
            </div>
          </div>
        ` : ''}

        <div class="c-section-card">
          <div style="font-size:13px;font-weight:700;margin-bottom:8px">模拟扫码（点击下方待核销名单一键扫码）</div>
          ${pendingList.length === 0 ? `<div style="font-size:12px;color:var(--text-muted);text-align:center;padding:18px">当前暂无待核销凭证，可切回“普通用户视角”先报一个名</div>` : ''}
          ${pendingList.map(({ act, tic, att }) => `
            <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px dashed #ECEEF2">
              <div>
                <div style="font-size:13px;font-weight:700">${att.data.name} <span style="font-family:monospace;color:var(--b-primary)">#${att.code}</span></div>
                <div style="font-size:11px;color:var(--text-secondary)">${act.title} · ${tic.name}</div>
              </div>
              <button class="c-cta-sm" style="background:var(--b-primary)" onclick="verifyByCode('${att.code}')">模拟扫码</button>
            </div>
          `).join('')}
        </div>
      `;

      bottom.innerHTML = `
        <div class="mp-bottom-bar" style="justify-content:center">
          <button class="btn btn-outline btn-sm" onclick="setCRole('user')">切回普通用户视角</button>
        </div>
      `;
    }

    function verifyByCode(code, fromBEnd = false) {
      const clean = String(code || '').trim();
      const match = allAttendeesFlat().find(x => x.att.code === clean);
      if (!match) { showToast('未找到该核销码'); return; }
      if (match.att.status !== 'pending_verify') { showToast('该凭证已核销或已取消'); return; }
      match.att.status = 'completed';
      if (match.order.attendees.every(a => a.status === 'completed')) match.order.status = 'completed';
      state.lastVerifiedResult = match;
      state.verifierInputCode = '';
      showToast(fromBEnd ? `PC 后台已为 ${match.att.data.name} 补核销` : `扫码核销成功：${match.att.data.name}`);
      renderAll();
    }

    function renderAll() { renderBEnd(); renderCEnd(); }
    renderAll();
  </script>
</body>
</html>
