<script>
const names=['张*明','李*华','王*强','陈*丽','赵*国','刘*芳','周*宇','吴*敏','徐*杰','孙*萍','郑*文','黄*清'];
const data=names.map((user,i)=>{const order=i%3===0||i===2;const amount=order?(i===2?2000:1000):30;return {id:'RP202609'+String(140012-i).padStart(6,'0'),uid:'U'+(10826+i),task:'TASK202609'+(2001+i),user,identity:'3302**********'+(3456+i),scene:order?'order':'employee',tenant:i%2?'示例商家 · 数码专营店':'示例商家 · 日用旗舰店',employee:order?'活动自动发放':'范双飞 · 企微员工',amount,date:'2026-09-'+(i<6?'14':'13'),time:'10:'+String(48-i*3).padStart(2,'0')+':12',status:i===4?'发放中':i===7?'发放失败':'已到账',missing:i===3||i===8,order:order?'38920194827'+(1038+i):'',base:i===2?21650:12800,wx:'WX_DEMO_202609'+(140012-i)};});
const $=id=>document.getElementById(id),money=n=>'¥'+(n/100).toFixed(2);let scene='all',page=1,filtered=[],selected=null,opener=null;const proofImages={};
function badge(text,cls=''){return `<span class="pill ${cls}">${text}</span>`}function taskName(d){return d.scene==='order'?'订单满返 · 晒单授权':'直播预告 · 推广体验'}function action(d){return d.scene==='order'?'提交订单，完成晒单推广授权':d.missing?'领取红包；未记录预告浏览':'领取红包，浏览直播预告'}
function render(){const kw=$('keyword').value.trim().toLowerCase(),start=$('start').value,end=$('end').value;filtered=data.filter(d=>(scene==='all'||d.scene===scene)&&(!$('tenant').value||d.tenant===$('tenant').value)&&(!$('status').value||d.status===$('status').value)&&(!start||d.date>=start)&&(!end||d.date<=end)&&(!kw||[d.id,d.uid,d.task,d.user,d.order,taskName(d)].join(' ').toLowerCase().includes(kw)));page=Math.min(page,Math.max(1,Math.ceil(filtered.length/6)));const paid=filtered.filter(d=>d.status==='已到账'),sum=paid.reduce((s,d)=>s+d.amount,0);$('stats').innerHTML=[['已到账红包总额',money(sum),'仅统计转账成功的红包'],['发放记录',filtered.length+'','含发放中及失败记录'],['已到账用户',new Set(paid.map(d=>d.uid)).size+'','按领取用户 ID 去重'],['待补充任务证据',filtered.filter(d=>d.missing).length+'','缺少直播预告浏览记录']].map(([a,b,c],i)=>`<div class="stat"><div class="statlabel">${a}<span style="color:${i===3?'#cca35e':'#9cb1e8'}">${['◈','▤','♙','◷'][i]}</span></div><strong>${b}</strong><small>${c}</small></div>`).join('');$('result').textContent=start&&end&&start>end?'开始日期不能晚于结束日期':'共 '+filtered.length+' 条记录 · 可查看每笔红包对应的任务与发放凭据';$('rows').innerHTML=filtered.slice((page-1)*6,page*6).map(d=>`<tr><td>${d.id}<span class="secondary">${d.date} ${d.time}</span></td><td>${d.user}<span class="secondary">${d.uid}</span></td><td>${d.tenant}<span class="secondary">${d.employee}</span></td><td>${taskName(d)}<span class="secondary">${action(d)}</span></td><td class="amount">${money(d.amount)}</td><td>${badge(d.status,d.status==='已到账'?'':d.status==='发放中'?'blue':'gray')}</td><td><button class="linkbtn" data-id="${d.id}">查看详情 →</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">没有符合条件的发放记录，请调整筛选条件。</td></tr>';$('range').textContent=filtered.length?`显示 ${(page-1)*6+1}–${Math.min(page*6,filtered.length)} 条，共 ${filtered.length} 条`:'共 0 条';$('page').textContent=page+' / '+Math.max(1,Math.ceil(filtered.length/6));$('prev').disabled=page===1;$('next').disabled=page*6>=filtered.length;document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('active',b.dataset.scene===scene);b.setAttribute('aria-selected',b.dataset.scene===scene)})}
function kv(label,value){return `<div><span>${label}</span>${value}</div>`}
function detail(id){selected=data.find(d=>d.id===id);const d=selected,order=d.scene==='order';opener=document.activeElement;$('detailid').textContent=d.id+' · 示例记录';const events=[['09:01:05','勾选《活动激励服务协议》','协议版本 v2.1 · 签署记录 AGR-DEMO-'+d.uid],['09:02:16',order?'订单提交与金额核验':'从企微红包卡片进入活动',order?'订单 '+d.order+'；核验实付 '+money(d.base):'发起员工：范双飞；入口：企微私聊'],['09:02:40','实名认证与收款授权','核验通过 · 身份及授权回执为演示记录'],[d.time,'发起红包转账','本次红包 '+money(d.amount)+' · '+d.status]];if(!order&&!d.missing)events.push([d.time.slice(0,6)+'18','展示直播预告广告位','发生在转账发起后；页面曝光 5.2 秒'],[d.time.slice(0,6)+'24','点击查看直播预告','点击事件 EVT-DEMO-'+d.uid+'；未记录直播预约']);$('detail').innerHTML=`<div class="reward"><div><span class="sub">本笔红包金额</span><strong>${money(d.amount)}</strong></div><div>${badge(d.status,d.status==='已到账'?'':'warn')}<div class="secondary" style="margin-top:9px">${d.date} ${d.time}</div></div></div><section class="section"><h3>领取用户与发放主体</h3><div class="kv">${kv('领取用户',d.user+' / '+d.uid)}${kv('证件号码（脱敏）',d.identity)}${kv('所属商家',d.tenant)}${kv('发起人',d.employee)}${kv('发放主体','宁波新空网络（示例）')}${kv('收款渠道','微信零钱')}</div></section><section class="section"><h3>用户做了什么任务</h3><div class="taskbox"><b>${taskName(d)}</b>　${badge(d.missing?'证据待补充':'记录已留存',d.missing?'warn':'blue')}<p>任务编号：${d.task}<br>关联活动：${order?'9 月订单满返活动':'今晚 19:00 品牌直播预告'}<br>奖励规则：${order?'累计核验金额满 '+(d.amount===2000?'199':'99')+' 元，可领取 '+money(d.amount)+' 红包（规则快照 v1.0）':'每次符合活动领取条件，可领取 ¥0.30 红包（规则快照 v1.0）'}<br>实际行为：${action(d)}。</p>${order?`<div>关联订单：${d.order}<br>本次核验金额：${money(d.base)}；奖励金额：${money(d.amount)}<br>晒单推广授权已记录；未提供独立的晒单发布凭证。</div>`:`<div>来源员工：范双飞；投放渠道：企微私聊卡片<br>${d.missing?'未获取直播预告曝光 / 点击记录，不能据此确认用户已浏览预告。':'已记录广告位曝光与预告点击；未记录预约行为。'}<br>预告浏览为领取后的行为，单独记录时间。</div>`}</div></section><section class="section"><h3>${order?'用户晒单图片':'用户推广图片'}</h3><div class="taskbox"><b>${order?'晒单内容与订单关联':'推广内容与任务关联'}</b><p>关联任务：${d.task}${order?'<br>关联订单：'+d.order:''}<br>图片来源：用户提交的任务附件</p><button id="addProof" type="button">＋ 选择图片预览</button><span class="secondary" style="margin-top:8px">支持 JPG、PNG、WebP；当前仅在本次页面会话预览，刷新后不保留。</span><div id="proofGallery"></div></div></section><section class="section"><h3>任务与发放时间线</h3><div class="timeline">${events.map(([time,title,desc])=>`<div class="event"><b>${title}</b><small>${d.date} ${time}</small><small>${desc}</small></div>`).join('')}</div></section><section class="section"><h3>资金凭据与税务记录</h3><div class="kv">${kv('系统发放单号',d.id)}${kv('微信转账单号',d.status==='发放失败'?'未生成成功凭据':d.wx)}${kv('到账金额',d.status==='已到账'?money(d.amount):'尚未到账')}${kv('到账时间',d.status==='已到账'?d.date+' '+d.time.slice(0,6)+'15':'—')}${kv('税务申报状态','未提供申报记录')}${kv('申报批次 / 税款 / 完税凭据','— / — / —')}</div>${d.status==='发放失败'?'<div class="notice" style="margin-top:16px">失败原因（示例）：收款账户状态异常，未到账。</div>':''}</section><div class="notice" style="margin-top:25px;margin-bottom:0">本页展示业务记录与示例凭据编号；未接入真实订单、微信支付或税务申报系统。</div>`;$('overlay').hidden=false;document.body.style.overflow='hidden';$('close').focus();renderProof();$('addProof').onclick=()=>$('proofUpload').click()}
function renderProof(){const images=proofImages[selected.id]||[];$('proofGallery').innerHTML=images.length?'<div class="proof-grid">'+images.map((url,i)=>`<button class="linkbtn" data-image="${i}" aria-label="放大任务图片 ${i+1}"><img class="proof-image" src="${url}" alt="任务附件 ${i+1}"></button>`).join('')+'</div>':'<div class="proof-empty">暂无用户提交的图片<br><span class="secondary">接入业务数据后展示该任务对应的原始图片</span></div>';$('proofGallery').onclick=e=>{const b=e.target.closest('[data-image]');if(!b)return;$('largeImage').src=images[Number(b.dataset.image)];$('imageViewer').hidden=false;$('closeImage').focus()}}
$('proofUpload').onchange=e=>{if(!selected)return;const files=[...e.target.files].filter(f=>['image/jpeg','image/png','image/webp'].includes(f.type));proofImages[selected.id]??=[];files.forEach(f=>proofImages[selected.id].push(URL.createObjectURL(f)));renderProof();e.target.value=''};
function closeImage(){ $('imageViewer').hidden=true;$('addProof')?.focus() }
$('closeImage').onclick=closeImage;$('imageViewer').onclick=e=>{if(e.target===$('imageViewer'))closeImage()};
function close(){ $('overlay').hidden=true;document.body.style.overflow='';opener?.focus() }
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('toast').textContent='已生成下载文件';$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,2500)}
$('export').onclick=()=>{const rows=[['发放单号','发放时间','用户','用户ID','商家','发起人','任务编号','任务类型','实际行为','关联订单','红包金额(元)','到账金额(元)','发放状态','任务证据','微信转账单号','税务申报状态'],...filtered.map(d=>[d.id,d.date+' '+d.time,d.user,d.uid,d.tenant,d.employee,d.task,taskName(d),action(d),d.order,(d.amount/100).toFixed(2),d.status==='已到账'?(d.amount/100).toFixed(2):'0.00',d.status,d.missing?'待补充':'已留存',d.status==='发放失败'?'':d.wx,'未提供申报记录'])];download('红包发放明细_示例.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')};$('detailExport').onclick=()=>download(selected.id+'_详情_示例.txt',$('detailid').innerText+'\n\n'+$('detail').innerText,'text/plain;charset=utf-8');
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{scene=b.dataset.scene;page=1;render()});['keyword','tenant','status','start','end'].forEach(id=>$(id).addEventListener(id==='keyword'?'input':'change',()=>{page=1;render()}));$('reset').onclick=()=>{['keyword','tenant','status'].forEach(id=>$(id).value='');$('start').value='2026-09-01';$('end').value='2026-09-14';scene='all';page=1;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('rows').onclick=e=>{const b=e.target.closest('[data-id]');if(b)detail(b.dataset.id)};$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};document.addEventListener('keydown',e=>{if(!$('imageViewer').hidden){if(e.key==='Escape')closeImage();if(e.key==='Tab'){e.preventDefault();$('closeImage').focus()}return}if($('overlay').hidden)return;if(e.key==='Escape')close();if(e.key==='Tab'){const buttons=[$('close'),$('detailExport')];if(e.shiftKey&&document.activeElement===buttons[0]){e.preventDefault();buttons[1].focus()}else if(!e.shiftKey&&document.activeElement===buttons[1]){e.preventDefault();buttons[0].focus()}}});render();
</script></body></html>
